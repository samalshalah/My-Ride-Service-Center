kind = "web"
previewPath = "/"
title = "United Mechanic"
version = "1.0.0"
id = "artifacts/united-mechanic"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19414

[services.development]
run = "pnpm --filter @workspace/united-mechanic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/united-mechanic", "run", "build" ]
publicDir = "artifacts/united-mechanic/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19414"
BASE_PATH = "/"
